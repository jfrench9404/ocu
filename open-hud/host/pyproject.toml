[project]
name = "openhud"
version = "0.1.0"
description = "Open-HUD host: event bus, preprocessing and BLE link for clip-on HUD glasses"
requires-python = ">=3.10"
dependencies = ["bleak>=0.22", "pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openhud = "openhud.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openhud*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
