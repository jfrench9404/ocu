; Open-HUD firmware — ESP32-C3 + SSD1306 128x64
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = xiao_esp32c3

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.19
    h2zero/NimBLE-Arduino@^1.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; NimBLE: we are a peripheral only — drop central/observer code to save RAM/flash
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; Seeed Studio XIAO ESP32C3 (default dev board)
[env:xiao_esp32c3]
board = seeed_xiao_esp32c3

; Generic ESP32-C3 DevKitM-1 / SuperMini boards
[env:esp32c3_devkit]
board = esp32-c3-devkitm-1
